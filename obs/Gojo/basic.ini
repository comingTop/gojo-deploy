[General]
Name=Gojo

[Output]
Mode=Simple

[SimpleOutput]
; Force software (x264) so a bad/cold NVIDIA driver state after a VM restart can't
; fail OBS with an NVENC error. The Virtual Camera itself outputs raw frames and
; needs no encoder; this only governs any stream/record output OBS might start.
StreamEncoder=x264
RecEncoder=x264

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=30

[Audio]
SampleRate=48000
ChannelSetup=Stereo
